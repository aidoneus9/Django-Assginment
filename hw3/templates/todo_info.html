<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>할일쿵야</title>
</head>
<body>
    <img src="https://f1.bigissue.kr/2023/12/we61ou3z85.jpg" alt="양파쿵야" width="300">
    <h1>할일쿵야 {{ todo.id }}. {{ todo.title }}</h1>
    <table>
        {% for k, v in todo.items %}
            {% if k != 'id' and k != 'title' %}
                <tr>
                    <th>{{ k }}</th>
                    <td>{{ v }}</td>
                </tr>
            {% endif %}
        {% endfor %}
    </table>
</body>
</html>
