<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
</head>
<body>
    <h1>또 왔냐? 할 일이 그렇게 많냐?</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">로그인</button>
        <span>
            아직 회원이 아니라고? 허촤 옛다 널 아끼는 마음으로...
            <a href="{% url 'signup' %}">회원가입</a>
        </span>
    </form>
</body>
</html>
