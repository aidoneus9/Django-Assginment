<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장고 연습생: 목록</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f0f0f0, #d4f5e9);
            color: #2c3e50;
        }

        h1 {
            text-align: center;
            padding: 60px 0 20px;
            font-size: 2.7em;
            color: #2e7d32;
            text-shadow: 1px 1px 1px rgba(128, 128, 128, 0.2);
        }

        ul {
            max-width: 600px;
            margin: 40px auto;
            padding: 0;
            list-style: none;
        }

        li {
            margin: 18px 0;
        }

        a {
            display: block;
            background: linear-gradient(145deg, #cfd8dc, #a5d6a7);
            color: #1b5e20;
            font-weight: 500;
            text-align: center;
            padding: 15px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.2em;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        a:hover {
            background: linear-gradient(145deg, #a5d6a7, #cfd8dc);
            transform: scale(1.03);
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>
<body>
    <h1>User List</h1>
    <ul>
        {% for user_id, name in user_data %}
            <li><a href="{% url 'user_info' user_id %}">{{ name }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
