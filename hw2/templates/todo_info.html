<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />"
    <title>할일쿵야</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 30px;
            color: #333;
        }
        h1 {
            color: #f1c40f; /* 개나리색 느낌 강조 */
            margin-bottom: 20px;
        }
        img {
            width: 200px;
            height: auto;
            margin-bottom: 25px;
        }
        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 60%;
        }
        th, td {
            border: 1px solid #f1c40f; /* 테두리 개나리색 */
            padding: 10px 15px;
            text-align: left;
        }
        th {
            background-color: #fff9c4; /* 아주 연한 노랑 (강조용) */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <img src="https://f1.bigissue.kr/2023/12/we61ou3z85.jpg" alt="양파쿵야" width="300">
    <h1>{{ todo.id }}번 할일쿵야: {{ todo.title }}</h1>
    <table>
        {% for k, v in todo.items %}
            {% if k != 'title' and k != 'id' %}
                <tr>
                    <th>{{ k }}</th>
                    <td>{{ v }}</td>
                </tr>
            {% endif %}
        {% endfor %}
    </table>
</body>
</html>
